databases:
  - name: financial-risk-postgres
    databaseName: financial_risk_db
    user: financial_risk_user
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: ai-financial-risk-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: financial-risk-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_DISABLED
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GRAPH_RAG_ENABLED
        value: "false"
      - key: REDIS_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: RAG_VECTOR_BACKEND
        value: chroma
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
