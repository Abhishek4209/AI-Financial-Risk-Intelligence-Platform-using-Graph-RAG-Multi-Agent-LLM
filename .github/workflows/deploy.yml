name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy React frontend to Vercel
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
    steps:
      - name: Skip when Vercel is not configured
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' || env.VITE_API_URL == '' }}
        run: echo "::notice::Vercel deployment skipped because one or more Vercel secrets are missing."
      - name: Check out tested main commit
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' && env.VITE_API_URL != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' && env.VITE_API_URL != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' && env.VITE_API_URL != '' }}
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build and deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' && env.VITE_API_URL != '' }}
        working-directory: frontend
        run: |
          npm install --global vercel
          vercel link --yes --project "$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-backend:
    name: Trigger Render backend deployment
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Skip when Render is not configured
        if: ${{ env.RENDER_DEPLOY_HOOK == '' }}
        run: echo "::notice::Render deployment skipped because RENDER_DEPLOY_HOOK is missing."
      - name: Trigger Render deploy hook
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: |
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"

  deployment-configuration:
    name: Report missing deployment credentials
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Report configured providers
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_VERCEL_ORG: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID != '' }}
          HAS_FRONTEND_API: ${{ secrets.VITE_API_URL != '' }}
          HAS_RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: |
          echo "## Production deployment configuration" >> "$GITHUB_STEP_SUMMARY"
          for item in HAS_VERCEL_TOKEN HAS_VERCEL_ORG HAS_VERCEL_PROJECT HAS_FRONTEND_API HAS_RENDER_HOOK; do
            if [ "${!item}" = "true" ]; then
              echo "- `$item`: configured" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- `$item`: missing — corresponding deployment is skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
