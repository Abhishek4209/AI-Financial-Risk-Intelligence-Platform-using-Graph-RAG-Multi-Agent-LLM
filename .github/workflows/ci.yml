name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyyaml

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [Path("docker-compose.yml"), Path("environment.yml")]
          files.extend(Path("configs").glob("*.yaml"))
          files.extend(Path("configs").glob("*.yml"))
          files.extend(Path(".github").rglob("*.yml"))

          for file in files:
              yaml.safe_load(file.read_text(encoding="utf-8"))
              print(f"Validated {file}")
          PY

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Run tests
        run: |
          pytest tests -q
          status=$?
          if [ "$status" -eq 5 ]; then
            echo "No tests were collected; continuing."
            exit 0
          fi
          exit "$status"

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [python-checks, frontend-checks]
    if: ${{ always() && needs.python-checks.result == 'success' && (needs.frontend-checks.result == 'success' || needs.frontend-checks.result == 'skipped') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: financial-risk-backend:ci