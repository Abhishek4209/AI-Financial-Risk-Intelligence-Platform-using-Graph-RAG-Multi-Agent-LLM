
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python checks and Qlty coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Ensure imports such as "from src.services import ..." resolve in CI.
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov pyyaml

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              Path("docker-compose.yml"),
              Path("environment.yml"),
          ]

          for directory in [Path("configs"), Path(".github")]:
              if directory.exists():
                  files.extend(directory.rglob("*.yaml"))
                  files.extend(directory.rglob("*.yml"))

          for file in sorted(set(files)):
              if file.is_file():
                  with file.open(encoding="utf-8") as stream:
                      yaml.safe_load(stream)
                  print(f"Validated: {file}")
          PY

      - name: Validate Docker Compose configuration
        run: |
          touch .env
          docker compose config --quiet

      - name: Run tests and generate coverage
        run: |
          python -m pytest tests \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            -q

      - name: Upload coverage to Qlty Cloud
        if: >-
          ${{
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        uses: qltysh/qlty-action/coverage@v2.3.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.xml
          format: cobertura
          skip-errors: false

      - name: Upload HTML coverage report
        if: always() && hashFiles('htmlcov/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: htmlcov/
          retention-days: 7

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python-checks, frontend-checks]
    if: >-
      ${{
        always() &&
        needs.python-checks.result == 'success' &&
        (
          needs.frontend-checks.result == 'success' ||
          needs.frontend-checks.result == 'skipped'
        )
      }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: financial-risk-backend:ci
