name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate YAML configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [Path("docker-compose.yml")]
          files.extend(Path("configs").glob("*.yaml"))
          files.extend(Path("configs").glob("*.yml"))
          for file in files:
              yaml.safe_load(file.read_text(encoding="utf-8"))
              print(f"Validated {file}")
          PY

      - name: Run tests
        run: |
          set +e
          pytest tests -q
          status=$?
          if [ "$status" -eq 5 ]; then
            echo "No tests were collected; continuing."
            exit 0
          fi
          exit "$status"

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: python-checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: financial-risk-backend:ci
