
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python checks and Qlty coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Ensure imports such as "from src.services import ..." resolve in CI.
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov pyyaml

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              Path("docker-compose.yml"),
              Path("environment.yml"),
          ]

          for directory in [Path("configs"), Path(".github")]:
              if directory.exists():
                  files.extend(directory.rglob("*.yaml"))
                  files.extend(directory.rglob("*.yml"))

          for file in sorted(set(files)):
              if file.is_file():
                  with file.open(encoding="utf-8") as stream:
                      yaml.safe_load(stream)
                  print(f"Validated: {file}")
          PY

      - name: Validate Docker Compose configuration
        run: |
          touch .env
          docker compose config --quiet

      - name: Run tests and generate coverage
        run: |
          python -m pytest tests \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            -q

      # Coverage XML stores paths relative to the src/ directory by default.
      # Prefix them with src/ so Qlty can match them to files in the repository.
      - name: Normalize coverage paths for Qlty
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          coverage_file = Path("coverage.xml")
          tree = ET.parse(coverage_file)
          root = tree.getroot()

          sources = root.find("sources")
          if sources is not None:
              sources.clear()
              ET.SubElement(sources, "source").text = "."

          for class_node in root.iter("class"):
              filename = class_node.get("filename", "")
              if filename and not filename.startswith("src/"):
                  class_node.set("filename", f"src/{filename}")

          tree.write(coverage_file, encoding="utf-8", xml_declaration=True)
          print("Normalized coverage paths for Qlty.")
          PY

      - name: Upload coverage to Qlty Cloud
        if: >-
          ${{
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        uses: qltysh/qlty-action/coverage@v2.3.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.xml
          format: cobertura
          skip-errors: false

      - name: Upload HTML coverage report
        if: always() && hashFiles('htmlcov/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: htmlcov/
          retention-days: 7

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm cache clean --force
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build frontend
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python-checks, frontend-checks]
    if: >-
      ${{
        always() &&
        needs.python-checks.result == 'success' &&
        (
          needs.frontend-checks.result == 'success' ||
          needs.frontend-checks.result == 'skipped'
        )
      }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: financial-risk-backend:ci

  email-notification:
    name: Email workflow and step status report
    runs-on: ubuntu-latest
    needs: [python-checks, frontend-checks, docker-build]
    if: always()
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    steps:
      - name: Collect status of every job and step
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });
            const actorResponse = await github.rest.users.getByUsername({ username: context.actor });
            const allSucceeded =
              '${{ needs.python-checks.result }}' === 'success' &&
              '${{ needs.frontend-checks.result }}' === 'success' &&
              '${{ needs.docker-build.result }}' === 'success';
            const lines = [
              'Workflow: ' + context.workflow,
              'Repository: ' + context.repo.owner + '/' + context.repo.repo,
              'Run number: #' + context.runNumber,
              'Triggered by GitHub account: ' + context.actor,
              'GitHub user ID: ' + actorResponse.data.id,
              'Event: ' + context.eventName,
              'Commit: ' + context.sha,
              'Run URL: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              'Overall result: ' + (allSucceeded ? 'SUCCESS' : 'FAILURE OR SKIPPED JOB'),
              '',
              'JOB AND STEP RESULTS'
            ];
            for (const job of response.data.jobs) {
              lines.push('', '[' + String(job.conclusion || job.status).toUpperCase() + '] ' + job.name);
              for (const step of (job.steps || [])) {
                lines.push('  - [' + String(step.conclusion || step.status || 'unknown').toUpperCase() + '] ' + step.name);
              }
            }
            core.setOutput('body', lines.join('\n'));
            core.setOutput('status', allSucceeded ? 'SUCCESS' : 'FAILURE / SKIPPED');

      - name: Send custom status email using Resend API
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          REPORT_BODY: ${{ steps.report.outputs.body }}
          REPORT_STATUS: ${{ steps.report.outputs.status }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::RESEND_API_KEY is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$RESEND_FROM_EMAIL" ]; then
            echo "::error::RESEND_FROM_EMAIL is missing. Set it to an email address on a domain verified in Resend."
            exit 1
          fi

          payload="$(jq -n \
            --arg from "$RESEND_FROM_EMAIL" \
            --arg to "abhishekupadhyay9336@gmail.com" \
            --arg subject "GitHub Actions $REPORT_STATUS: ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}" \
            --arg text "$REPORT_BODY" \
            '{from: $from, to: [$to], subject: $subject, text: $text}')"

          response="$(curl --fail-with-body --silent --show-error \
            --request POST "https://api.resend.com/emails" \
            --header "Authorization: Bearer $RESEND_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$payload")"
          echo "Resend accepted the email request."
          echo "$response" | jq '{id: .id}'

